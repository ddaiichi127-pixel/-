<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Love Survey</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #ff4d6d; font-family: sans-serif; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 300px; position: relative; }
        .gif-container img { width: 100px; margin-bottom: 20px; }
        .buttons { display: flex; justify-content: space-around; margin-top: 20px; min-height: 45px; position: relative; }
        button { padding: 10px 25px; border: none; border-radius: 50px; font-size: 16px; cursor: pointer; transition: 0.1s; width: 100px; }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #a2a2d0; color: white; position: absolute; right: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div class="gif-container">
        <img src="https://tenor.com" alt="Cute Cat">
    </div>
    <p id="question">Friend Zone ကို ကျော်ဖြတ်ရအောင်လေ</p>
    <div class="buttons">
        <button id="yesBtn" onclick="confessed()">Yes</button>
        <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
    </div>
</div>

<script>
    function moveButton() {
        const noBtn = document.getElementById('noBtn');
        const card = document.querySelector('.card');
        
        const maxX = card.clientWidth - noBtn.clientWidth - 20;
        const maxY = card.clientHeight - noBtn.clientHeight - 40;
        
        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY) + 40;
        
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
        
        noBtn.innerText = "Please!";
    }

    function confessed() {
        document.getElementById('question').innerHTML = "ချစ်တယ်လို့ ပြောပေးလို့ ကျေးဇူးပဲနော်! ❤️";
        document.querySelector('.buttons').style.display = 'none';
    }
</script>

</body>
</html>
